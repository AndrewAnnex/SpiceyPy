name: SPICEYPY_DOCS

channels:
  - conda-forge
  - nodefaults

dependencies:
  - python=3.13
  - numpy>=2.0,<3
  - cython>=3.0.12
  - myst-parser==2.0.0
  - docutils
  - graphviz
  - sphinx<=7.0.0
  - sphinx-copybutton
  - sphinx-autodoc-typehints
  - sphinx_rtd_theme
  # the gallery examples run at build time
  - sphinx-gallery>=0.17
  - matplotlib-base
  - pillow
  - scipy
  - sympy
  - astropy
  # the JupyterLite scratchpad page; the kernel version sets the Pyodide
  # version (0.8.x: Pyodide 314), which must match spiceypy's Pyodide wheel
  - jupyterlite-sphinx
  - jupyterlite-pyodide-kernel=0.8
  - recommonmark
  - pip
variables:
  CONDA_APPEND_CORE_REQUIREMENTS: False
